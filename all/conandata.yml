"25.11":
  sources:
    url: "https://github.com/PixarAnimationStudios/OpenUSD/archive/refs/tags/v25.11.tar.gz"
    sha256: "c37c633b5037a4552f61574670ecca8836229b78326bd62622f3422671188667"

  overrides:
    # from ffmpeg
    - "xz_utils/5.8.1"
    - "openjpeg/2.5.2"
     # all of these are due to openimageio:
    - "openexr/3.4.4"
    - "libpng/1.6.53"
    - "libtiff/4.7.1"
    - "libjpeg/9f"

  requirements:
    boost:
      force: True
      # updating boost to 1.89+ blocked by https://github.com/conan-io/conan-center-index/issues/28799
      # known issue in openimageio/2.x needs to be patched, or maybe updated to latest version
      version: "1.86.0@lyanovsk/master" # https://github.com/conan-io/conan-center-index/pull/29093
      orig: "1.86.0" # taken from latest version checked for by 'build_usd.py'
    materialx:
      version: "1.39.4"
      orig: "1.39.3"
    onetbb:
      force: True
      version: "2021.12.0"
      orig: "2021.12.0"
    opencolorio:
      force: True
      version: "2.5.0"
      orig: "2.2.1"
    openexr: # unused?
      version: "3.4.4"
      orig: "3.1.13"
    openimageio:
      version: "2.5.16.0"
      orig: "2.5.16.0"
    opensubdiv:
      version: "3.7.0"
      orig: "3.6.1"
    osl:
      version: null # no conan package exists for this
      orig: "1.10.9"
    ptex:
      version: "2.4.2"
      orig: "2.4.2"
    embree:
      version: "4.4.0"
      orig: "4.3.3"
    alembic:
      version: "1.8.8"
      orig: "1.8.5"
    draco:
      version: "1.5.7"
      orig: "1.5.6"
    openvdb:
      version: "12.1.1"
      orig: "10.1.0"
    imath:
      # build_usd.py forces openexr to build its own version of imath, prob to deal with conflicts
      force: True
      version: "3.2.1" #alembic explicitly depends on this version, so use it to avoid conflict
      orig: null

"25.05.01":
  sources:
    url: "https://github.com/PixarAnimationStudios/OpenUSD/archive/refs/tags/v25.05.01.tar.gz"
    sha256: "f424e8db26e063a1b005423ee52142e75c38185bbd4b8126ef64173e906dd50f"

  overrides:
    - "openexr/3.3.3"
    - "libpng/1.6.42" # resolve conflict openimageio has with one of its own deps (freetype)
    - "openjpeg/2.5.2" # transitive conflict in ffmpeg

  requirements:
    boost:
      version: "1.84.0" # openvdb wants 1.84
      orig: "1.86.0" # taken from latest version checked for by 'build_usd.py'
    materialx:
      version: "1.39.1"
      orig: "1.39.3"
    onetbb:
      force: True
      version: "2021.12.0"
      orig: "2021.9.0"
    opencolorio:
      force: True
      version: "2.4.2" # 2.4.x contains fix for newer gcc/clang
      orig: "2.1.3"
    openexr: # unused?
      version: "3.3.3" #"3.1.9"
      orig: "3.1.11"
    openimageio:
      version: "2.5.16.0"
      orig: "2.5.16.0"
    opensubdiv:
      version: "3.6.0"
      orig: "3.6.0"
    osl:
      version: null # no conan package exists for this
      orig: "1.10.9"
    ptex:
      version: "2.4.2"
      orig: "2.4.2"
    embree3:
      version: "3.13.5"
      orig: "3.2.2"
    alembic:
      version: "1.8.5"
      orig: "1.8.5"
    draco:
      version: "1.5.6" # 1.3.6 exists but has build errors on recent compilers
      orig: "1.3.6"
    openvdb:
      version: "9.1.0"
      orig: "9.1.0"
    imath:
      version: "3.1.9" #alembic explicitly depends on this version, so use it to avoid conflict
      orig: null


